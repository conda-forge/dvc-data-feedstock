{% set name = "dvc-data" %}
{% set version = "3.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c380c32cb3bf52195e285b0d84bcc0cf8eed0fb09ba9173bdf53b279a74481ce

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm >=6.3.1
  run:
    - orjson >=3,<4
    - python >={{ python_min }}
    - attrs >=21.3.0
    - dictdiffer >=0.8.1
    - diskcache >=5.2.1
    - dvc-objects >=5.2,<6
    - fsspec >=2024.2.0
    - funcy >=1.14
    - pygtrie >=2.3.2
    - sqltrie >=0.11.0,<1
    - tqdm >=4.63.1,<5

test:
  imports:
    - dvc_data
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/iterative/dvc-data
  summary: DVC data management library
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - efiop
    - daavoo
    - pmrowla
    - shcheklein
    - skshetry
